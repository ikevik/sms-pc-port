# Manual job: how far does the game build with clang targeting Windows (msvc)?
# Create a second pipeline from this file and run it by hand; results are in the
# run summary and the clang-survey artifact (summary.md plus the full logs).
# Tick "uwp" to build against the UWP store libraries instead (what fails to link there).
trigger: none
pr: none

parameters:
- name: uwp
  displayName: Target UWP (store libraries, AppContainer)
  type: boolean
  default: false

jobs:
- job: clang_survey
  displayName: Clang (msvc target) build survey
  timeoutInMinutes: 60
  pool:
    vmImage: windows-2022
  steps:
  # No CRLF conversion on checkout: the decomp patches must match the sources byte for byte.
  - script: git config --global core.autocrlf false
    displayName: Keep line endings as committed

  - checkout: self
    submodules: recursive

  - powershell: ./tools/ci/clang_survey.ps1 -Build build-clang -Uwp:$${{ parameters.uwp }}
    displayName: Build survey with clang (msvc target)
    continueOnError: true

  - publish: build-clang-survey
    artifact: clang-survey
    condition: always()
